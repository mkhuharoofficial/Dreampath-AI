  </text>
  <text x="615" y="115" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="58" letter-spacing="-1" fill="#38bdf8">
    AI
  </text>

  <!-- Tagline -->
  <text x="232" y="155" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="18" letter-spacing="4" fill="#cbd5e1" text-transform="uppercase">
    CAREER GUIDANCE PLATFORM
  </text>
  <text x="232" y="180" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8">
